[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wormcat3-web"
version = "0.1.0"
description = "Web interface and FastAPI backend for WormCat 3"
requires-python = ">=3.13"
dependencies = [
    "matplotlib==3.10.8",
    "wormcat3",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.6",
    "openpyxl>=3.1.0",
    "gunicorn>=21.0.0",
    "python-dotenv>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["backend/test"]
norecursedirs = ["backend/redis", "node_modules", "frontend", ".venv"]
pythonpath = ["backend"]
asyncio_mode = "auto"
log_cli = true
log_cli_level = "DEBUG"

[tool.ruff]
target-version = "py313"
line-length = 100
