[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wormcat3-web"
version = "0.1.0"
description = "Web interface and FastAPI backend for WormCat 3"
requires-python = ">=3.13"
dependencies = [
    "matplotlib==3.10.8",
    "wormcat3",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "pytest>=7.0.0",
    "httpx>=0.24.0",
    "celery>=5.3.0",
    "redis>=4.5.0",
    "python-multipart>=0.0.6",
    "openpyxl>=3.1.0",
    "gunicorn>=21.0.0",
    "python-dotenv>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.uv.sources]
wormcat3 = { path = "../wormcat3", editable = true }

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["backend/test"]
pythonpath = ["backend"]
log_cli = true
log_cli_level = "DEBUG"

[tool.ruff]
target-version = "py313"
line-length = 100
